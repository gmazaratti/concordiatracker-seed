# Compiles the iOS app on a free GitHub macOS runner. UNSIGNED, no secrets.
#
# THE POINT OF THIS FILE: the only machine that can compile an iOS app is a
# Mac, and this project is developed on Windows. This is the free regression
# test: it proves the web build, the Capacitor sync, the Swift in ios/ (the
# sign-in sheet and widget plugins, the WidgetKit extension) and the Xcode
# project all still compile, with no Apple credentials at all.
#
# RELEASES DO NOT GO THROUGH HERE. Signed builds and TestFlight uploads run on
# Codemagic (codemagic.yaml), which signs with an App Store Connect API key.
#
# ios/ is committed (it holds authored native code), so the project is used as
# it is in the repository: `cap sync` only copies the web build in and refreshes
# the Swift Package list. Dependencies are Swift packages, so there is no
# CocoaPods step and no .xcworkspace.
name: iOS

# Manual only: the macOS minute multiplier makes this worth running on purpose.
# (Free on this repo regardless, since it is public.)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The web build IS the app. If this fails, nothing downstream matters.
      - name: Build web assets
        run: npm run build

      - name: Sync the web build into the iOS project
        run: npx cap sync ios

      # Unsigned: catches the failure that actually happens in practice, native
      # code that will not compile, without any credentials.
      - name: Build (unsigned)
        working-directory: ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
