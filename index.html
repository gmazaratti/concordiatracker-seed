<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      /*
        The crawler fallback.

        The build injects the real page copy into #root so that clients which do
        not run JavaScript — GPTBot, PerplexityBot, ClaudeBot — read something
        other than an empty div. React clears the container when it mounts, but
        "when it mounts" is several hundred milliseconds after first paint, so
        the fallback was visible as a flash of the hero and the FAQ before the
        app appeared.

        Hiding it is keyed to the class set by the script below, which runs in
        <head> before the body is parsed. A client running JavaScript therefore
        never paints it at all; a client that is not gets the text, because the
        class is never added. The markup stays in the document either way, which
        is what the crawlers actually read.
      */
      .js #ct-prerender {
        display: none !important;
      }
    </style>
    <script>
      // Set before the body is parsed, so the rule above applies to the very
      // first paint rather than to the second one.
      document.documentElement.className += ' js'

      // Apply the saved theme before first paint so there's no flash of the default.
      try {
        var t = localStorage.getItem('ct_theme')
        // Automatic: whichever of Dark / Light the system is in right now.
        if (t === 'auto') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        if (t === 'dark' || t === 'maroon' || t === 'light' || t === 'purple' || t === 'rose')
          document.documentElement.dataset.theme = t
        else if (t === 'custom') {
          // A custom theme is a base palette plus derived accent variables. The
          // derivation lives in lib/color.ts and is NOT repeated here — the
          // provider caches its result, and this replays it. A stale or missing
          // cache costs one frame of the default accent, never a broken page.
          var c = JSON.parse(localStorage.getItem('ct_theme_custom') || '{}')
          document.documentElement.dataset.theme = c.base === 'light' ? 'light' : 'dark'
          var v = JSON.parse(localStorage.getItem('ct_theme_vars') || '{}')
          for (var k in v) document.documentElement.style.setProperty(k, v[k])
        }
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Referrers are the origin only, even between our own pages: a claim link
         (/join/<token>) must not ride along as the referrer of the next page. -->
    <meta name="referrer" content="strict-origin" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0f0f16" />
    <script>
      // The browser draws its own chrome (status bar, an installed app's frame)
      // from the two tags above, so they follow the saved theme too. Runs after
      // them because a script cannot edit a tag the parser has not reached yet.
      // Canvas colours mirror src/index.css; ThemeProvider keeps them in step.
      try {
        var d = document.documentElement
        var canvas = { dark: '#0f0f16', maroon: '#1a0d12', purple: '#181a3d', light: '#f5f6f4', rose: '#fdf6f8' }
        var th = d.dataset.theme || 'dark'
        var bg = d.style.getPropertyValue('--ct-canvas').trim() || canvas[th] || canvas.dark
        var light = th === 'light' || th === 'rose'
        document.querySelector('meta[name="theme-color"]').setAttribute('content', bg)
        document.querySelector('meta[name="color-scheme"]').setAttribute('content', light ? 'light' : 'dark')
      } catch (e) {}
    </script>

    <!-- Installed-app (PWA) standalone behaviour -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="ConcordiaTracker" />
    <meta name="robots" content="index, follow" />

    <!-- Title + description mirror the homepage (src/features/dev-landing-2/RecordlyPage.tsx); change them together. -->
    <title>ConcordiaTracker — GPA, syllabus &amp; assignment tracker for Concordia students</title>
    <meta
      name="description"
      content="Upload your course outline and every deadline is dated for you. Track grades, see what you need to pass, sync Moodle, and follow campus clubs. Not affiliated with Concordia University."
    />
    <link rel="canonical" href="https://concordiatracker.com/" />

    <!-- Open Graph / social preview -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ConcordiaTracker" />
    <meta property="og:title" content="ConcordiaTracker — GPA, syllabus &amp; assignment tracker for Concordia students" />
    <meta
      property="og:description"
      content="Upload your course outline and every deadline is dated for you. Track grades, see what you need to pass, sync Moodle, and follow campus clubs. Not affiliated with Concordia University."
    />
    <meta property="og:url" content="https://concordiatracker.com/" />
    <meta property="og:image" content="https://concordiatracker.com/og-image.png" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="640" />
    <meta property="og:locale" content="en_CA" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ConcordiaTracker — GPA, syllabus &amp; assignment tracker for Concordia students" />
    <meta
      name="twitter:description"
      content="Upload your course outline and every deadline is dated for you. Track grades, see what you need to pass, sync Moodle, and follow campus clubs. Not affiliated with Concordia University."
    />
    <meta name="twitter:image" content="https://concordiatracker.com/og-image.png" />

    <!--
      The two origins every signed-in screen fetches from, warmed before any
      of our JavaScript has decided to. DNS + TLS to Supabase is 100-300ms on
      a phone network, and it was being paid serially the moment the first
      avatar or post image appeared. `preconnect` opens the socket; it does
      NOT download anything, so it costs the landing page nothing — which is
      the constraint, since that page must not get slower to make Community
      faster.
    -->
    <link rel="preconnect" href="https://auth.concordiatracker.com" crossorigin />
    <link rel="dns-prefetch" href="https://auth.concordiatracker.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
